<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant-Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Soil-Moisture (Last 24 hours)</h2>
        <canvas id="moistureChart"></canvas>
    </div>

    <script>
        const CHANNEL_ID = '3502548';
        const READ_API_KEY = 'DG07N96EBR9D6EMK';

        const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&minutes=1440`;

        const ctx = document.getElementById('moistureChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Ficus-Microcarpa (%)', data: [], borderColor: '#3b82f6', tension: 0.3, pointRadius: 0 },
                    { label: 'Coffee-Plant (%)', data: [], borderColor: '#10b981', tension: 0.3, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                scales: { y: { min: 0, max: 100 } }
            }
        });

        async function fetchThingSpeakData() {
            try {
                const response = await fetch(url);
                const data = await response.json();

                const labels = [];
                const plant1 = [];
                const plant2 = [];

                data.feeds.forEach(feed => {
                    const date = new Date(feed.created_at);
                    labels.push(date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));

                    plant1.push(feed.field1);
                    plant2.push(feed.field2);
                });

                chart.data.labels = labels;
                chart.data.datasets[0].data = plant1;
                chart.data.datasets[1].data = plant2;
                chart.update();
            } catch (error) {
                console.error("Fehler beim Abrufen der Daten:", error);
            }
        }

        fetchThingSpeakData();

        setInterval(fetchThingSpeakData, 16000);
    </script>
</body>

</html>
